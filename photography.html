<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Daily photography by Mingxin Wu.">
    <meta name="author" content="Mingxin Wu">
    <title>Daily Photography | Mingxin Wu</title>
    <link rel="stylesheet" href="styles.css?v=2">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Back to home">Mingxin Wu</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="index.html#research">Research</a>
        <a href="index.html#publications">Publications</a>
        <a href="index.html#teaching">Teaching</a>
        <a href="index.html#hobby">Hobby</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">
        <span class="theme-icon" aria-hidden="true">*</span>
      </button>
    </header>

    <main>
      <section class="subpage-hero">
        <div class="content-wrap">
          <p class="eyebrow">Hobby</p>
          <h1>Daily Photography</h1>
          <p class="lead">Photo series organized by time and place.</p>
        </div>
      </section>

      <section class="section">
        <div class="content-wrap">
          <article class="photo-series">
            <div class="series-heading">
              <div>
                <h2>Place / Series Title</h2>
                <p>YYYY.MM - YYYY.MM · Short description of this photo series.</p>
              </div>
            </div>
            <div class="series-grid">
              <figure class="photo-card">
                <img src="assets/photos/series-2/photo-1.jpg" onerror="this.onerror=null; this.src='assets/photo-placeholder.svg';" alt="Photo placeholder">
                <figcaption>
                  <strong>Photo Title</strong>
                  <span>Short caption or location.</span>
                </figcaption>
              </figure>
              <figure class="photo-card">
                <img src="assets/photos/series-2/photo-2.jpg" onerror="this.onerror=null; this.src='assets/photo-placeholder.svg';" alt="Photo placeholder">
                <figcaption>
                  <strong>Photo Title</strong>
                  <span>Short caption or location.</span>
                </figcaption>
              </figure>
              <figure class="photo-card">
                <img src="assets/photos/series-2/photo-3.jpg" onerror="this.onerror=null; this.src='assets/photo-placeholder.svg';" alt="Photo placeholder">
                <figcaption>
                  <strong>Photo Title</strong>
                  <span>Short caption or location.</span>
                </figcaption>
              </figure>
            </div>
          </article>
          

          <article class="photo-series">
            <div class="series-heading">
              <div>
                <h2>Hefei / The corner of USTC</h2>
                <p>2026.03 - 2026.04 · daily shots</p>
              </div>
            </div>
            <div class="series-grid">
              <figure class="photo-card">
                <img src="assets/photos/series-1/IMG_20260314_183854.jpg" onerror="this.onerror=null; this.src='assets/photo-placeholder.svg';" alt="Photo placeholder">
                <figcaption>
                  <strong>Tree</strong>
                  <span>The tail of winter.</span>
                </figcaption>
              </figure>
              <figure class="photo-card">
                <img src="assets/photos/series-1/IMG_20260426_161750.jpg" onerror="this.onerror=null; this.src='assets/photo-placeholder.svg';" alt="Photo placeholder">
                <figcaption>
                  <strong>Moon in day</strong>
                  <span>Blue sky, white moon, green tree.</span>
                </figcaption>
              </figure>
              <figure class="photo-card">
                <img src="assets/photos/series-1/IMG_20260428_171737.jpg" onerror="this.onerror=null; this.src='assets/photo-placeholder.svg';" alt="Photo placeholder">
                <figcaption>
                  <strong>Cat</strong>
                  <span>Cute, right?</span>
                </figcaption>
              </figure>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>&copy; <span id="year"></span> Mingxin Wu</span>
      <a href="index.html">Back to home</a>
    </footer>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lightbox-close" type="button" aria-label="Close full image">×</button>
      <img class="lightbox-image" src="" alt="">
      <div class="lightbox-caption">
        <strong></strong>
        <span></span>
      </div>
    </div>

    <script src="script.js?v=2"></script>
  </body>
</html>
